# Автопроверки Listing Suite: весь набор tests/ без базы и секретов.
# Запускается на каждый PR, на пуш в main и на ветки ci-check/** (пробные прогоны).
# Секретов здесь нет и не будет: репозиторий публичный, а всё, что ходит наружу
# (база, Кабинет, Figma, провайдеры моделей, SP-API), подменено в самих тестах.
# Тест, который падает только без секретов, — поломка теста (TASKS.md, T-15).
name: CI

on:
  pull_request:
  push:
    branches: [main, "ci-check/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # test_figma_plugin.py исполняет code.js плагина по-настоящему: без
      # движка JavaScript он падает, а не пропускает проверку.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Тесты (синтаксис, импорт, переводы, весь tests/)
        run: python tests/run_all.py
